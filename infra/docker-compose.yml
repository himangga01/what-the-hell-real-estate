name: what-the-hell-real-estate

services:
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    image: what-the-hell-real-estate-db:postgres18-postgis3.6-pgvector0.8.2
    environment:
      # Local fixture defaults only; deployments must override these values.
      POSTGRES_DB: ${POSTGRES_DB:-real_estate}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/init/001-extensions.sql:/docker-entrypoint-initdb.d/20-extensions.sql:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready --username="$${POSTGRES_USER}" --dbname="$${POSTGRES_DB}" &&
          psql --username="$${POSTGRES_USER}" --dbname="$${POSTGRES_DB}"
          --tuples-only --no-align --command="SELECT
          current_setting('server_version_num')::integer / 10000 = 18
          AND count(*) FILTER (WHERE extname = 'postgis'
          AND extversion ~ '^3\.6(\.|$)') = 1
          AND count(*) FILTER (WHERE extname = 'vector'
          AND extversion = '0.8.2') = 1
          FROM pg_catalog.pg_extension
          WHERE extname IN ('postgis', 'vector');" | grep -qx t
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres_data:
