[project]
name = "what-the-hell-real-estate-pdf-ocr"
version = "0.1.0"
description = "Fail-closed RapidOCR and Docling research pipeline for Korean government PDFs"
requires-python = ">=3.12,<3.13"
dependencies = [
    "docling>=2.115,<3",
    "docling-ibm-models>=3.13,<4",
    "jsonschema>=4.25,<5",
    "onnxruntime>=1.22,<2",
    "pillow>=12,<13",
    "pymupdf>=1.26,<2",
    "pypdf>=6,<7",
    "rapidocr>=3.9.1,<4",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
]

[project.scripts]
pdf-ocr = "pdf_ocr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_ocr"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
